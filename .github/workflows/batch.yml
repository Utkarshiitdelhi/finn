# Scheduled batch jobs. Times are UTC (IST − 5:30).
# NSE often blocks cloud runners: `poll` falls back to BSE, and you can always run it from the laptop.
name: finn-batch
on:
  schedule:
    - cron: "*/30 3-10 * * 1-5"   # poll filings every 30 min, 8:30 am–4:30 pm IST, weekdays
    - cron: "45 10 * * 1-5"       # EOD prices + rules at 4:15 pm IST
    - cron: "0 3 * * *"           # morning brief 8:30 am IST
    - cron: "0 11 * * 1-5"        # evening brief 4:30 pm IST
    - cron: "*/10 2-17 * * *"     # keep the Render free instance awake during the day
  workflow_dispatch:
    inputs:
      job:
        description: "poll | eod | brief | research"
        required: true
        default: poll
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Keep-alive ping
        if: github.event.schedule == '*/10 2-17 * * *'
        working-directory: .
        run: curl -fsS "${{ secrets.API_URL }}/health" || true
      - uses: actions/checkout@v4
        if: github.event.schedule != '*/10 2-17 * * *'
      - uses: actions/setup-python@v5
        if: github.event.schedule != '*/10 2-17 * * *'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - if: github.event.schedule != '*/10 2-17 * * *'
        run: pip install -r requirements.txt
      - name: Pick job
        if: github.event.schedule != '*/10 2-17 * * *'
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "*/30 3-10 * * 1-5") echo "job=poll" >> $GITHUB_OUTPUT ;;
            "45 10 * * 1-5") echo "job=eod" >> $GITHUB_OUTPUT ;;
            "0 3 * * *"|"0 11 * * 1-5") echo "job=brief" >> $GITHUB_OUTPUT ;;
            *) echo "job=${{ github.event.inputs.job }}" >> $GITHUB_OUTPUT ;;
          esac
      - if: github.event.schedule != '*/10 2-17 * * *'
        run: python -m jobs.run ${{ steps.pick.outputs.job }}
